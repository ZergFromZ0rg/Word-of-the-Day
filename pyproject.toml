[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "word-of-the-day"
version = "0.1.0"
description = "Pick a daily word from a list and look it up in Merriam-Webster and other dictionaries."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
word-of-the-day = "word_of_day.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
word_of_day = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
