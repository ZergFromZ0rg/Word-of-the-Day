[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "word-of-the-day"
version = "0.2.0"
description = "Pick a daily word from a list and look it up in Merriam-Webster and other dictionaries."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Time zone database for WOTD_TIMEZONE on systems without one (Windows, slim images).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
word-of-the-day = "word_of_day.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
word_of_day = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["word_of_day"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true
